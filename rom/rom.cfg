# rom.cfg: ld65 layout for the TR ][ ROMs.
#   build/tr-rom.bin  12K at $D000-$FFFF. $D000-$F7FF is BASIC's space: Microsoft's
#                      BASIC-M6502 (rom/basic.s) from $D000, then $02 ("missing routine")
#                      up to $F7FF. $F800-$FFFF holds the documented Monitor entry points
#                      (stubs and fences).
#   build/tr-ext.bin  2K extension ROM at $C800-$CFFF: the Monitor's routine bodies.
# BASIC's zero page (BZP) and page one (BPG1) are addresses only: nothing from them goes in
# a ROM file. Microsoft's INIT copies CHRGET and the random seed down from ROM.
MEMORY {
    ZP:  start = $0000, size = $0100, type = rw, file = "";
    PG1: start = $00FF, size = $0101, type = rw, file = "";
    EXT: start = $C800, size = $0800, type = ro, fill = yes, fillval = $02, file = "build/tr-ext.bin";
    ROM: start = $D000, size = $3000, type = ro, fill = yes, fillval = $02, file = %O;
}
SEGMENTS {
    BZP:     load = ZP,  type = rw;
    BPG1:    load = PG1, type = rw;
    EXT:     load = EXT, type = ro, start = $C800;
    BASIC:   load = ROM, type = ro, start = $D000;
    MONITOR: load = ROM, type = ro, start = $F800;
}
